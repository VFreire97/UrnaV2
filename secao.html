<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secao de votacao</title><link rel="stylesheet" href="css/app.css"></head><body><header class="top"><div><div class="eyebrow">TERMINAL DE SECAO</div><h1 id="sectionTitle">Secao</h1></div><button id="logout" class="btn ghost">SAIR</button></header><main class="wrap two"><section class="card"><h2>Mesario</h2><div id="electionState" class="state">Carregando...</div><label>RA do eleitor</label><input id="ra" inputmode="numeric"><button id="lookup" class="btn primary">CONSULTAR</button><div id="voterData" class="msg"></div><button id="release" class="btn success" disabled>LIBERAR URNA</button></section><section class="card"><h2>Status da secao</h2><div id="stats"></div><button id="finishSection" class="btn danger">ENCERRAR TRABALHOS DA SECAO</button><div id="sectionMsg" class="msg"></div></section><section class="card full"><h2>Urna da secao</h2><div id="ballotLock" class="ballot locked"><h3>AGUARDE</h3><p>Aguardando liberacao do mesario.</p></div><div id="ballot" class="ballot hidden"><div class="screen"><span>SEU VOTO PARA</span><h2>CHAPA</h2><div id="digits" class="digits">__</div><h3 id="slateLabel"></h3><p id="ballotHint">Digite o numero da chapa.</p></div><div class="keypad" id="keypad"></div><div class="actions"><button id="white" class="key white">BRANCO</button><button id="correct" class="key orange">CORRIGE</button><button id="confirm" class="key green">CONFIRMA</button></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/core.js"></script><script src="js/secao.js"></script></body></html>
