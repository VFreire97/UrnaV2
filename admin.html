<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administracao</title><link rel="stylesheet" href="css/app.css"></head><body><header class="top"><div><div class="eyebrow">SISTEMA ELEITORAL ESCOLAR</div><h1>Administracao central</h1></div><button id="logout" class="btn ghost">SAIR</button></header><main class="wrap"><section class="metrics"><article><span>Eleitores</span><strong id="mEleitores">0</strong></article><article><span>Votantes</span><strong id="mVotantes">0</strong></article><article><span>Secoes</span><strong id="mSecoes">0</strong></article><article><span>Status</span><strong id="mStatus">-</strong></article></section>
<section class="card"><h2>1. Eleicao</h2><div class="row"><input id="electionName" placeholder="Nome da eleicao" value="Eleicao do Gremio Estudantil"><button id="createElection" class="btn primary">CRIAR ELEICAO</button><button id="startElection" class="btn success">INICIAR</button><button id="closeElection" class="btn danger">ENCERRAR</button></div><div id="electionMsg" class="msg"></div></section>
<section class="card"><h2>2. Secoes</h2><div class="row"><input id="sectionCode" placeholder="Codigo: 01"><input id="sectionName" placeholder="Nome: Secao 01"><button id="addSection" class="btn primary">ADICIONAR SECAO</button></div><div id="sections"></div><div id="sectionMsg" class="msg"></div></section>
<section class="card"><h2>3. Chapas</h2><div class="row"><input id="slateNumber" inputmode="numeric" maxlength="2" placeholder="Numero"><input id="slateName" placeholder="Nome da chapa"><button id="addSlate" class="btn primary">ADICIONAR CHAPA</button></div><div id="slates"></div><div id="slateMsg" class="msg"></div></section>
<section class="card"><h2>4. Eleitores (.xlsx)</h2><p>A planilha deve ter as colunas <b>RA</b>, <b>NOME</b> e <b>SECAO</b>.</p><input id="xlsx" type="file" accept=".xlsx"><button id="importVoters" class="btn primary">IMPORTAR ELEITORES</button><div id="importMsg" class="msg"></div></section>
<section class="card"><h2>5. Monitor das secoes</h2><div id="sectionMonitor"></div></section>
<section class="card"><h2>6. Totalizacao</h2><p id="totalHint">Disponivel somente apos o encerramento.</p><button id="totalize" class="btn success">TOTALIZAR</button><div id="results"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="js/config.js"></script><script src="js/core.js"></script><script src="js/admin.js"></script></body></html>
